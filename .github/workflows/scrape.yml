name: scrape
on:
  schedule:
    # 每日 15:00 UTC = 台北 23:00，一天只抓一次
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一時間只跑一個 scrape，避免多個觸發同時 push 衝突（也用來對 23 點多重觸發去重）
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate — 一天只抓一次（台北 23 點）
        id: gate
        run: |
          H=$(TZ=Asia/Taipei date +%H)
          TODAY=$(TZ=Asia/Taipei date +%F)
          echo "台北 $TODAY $H 點"
          # Cloudflare Worker 每小時觸發，但只在台北 23 點真正執行 → 一天一筆
          if [ "$H" != "23" ]; then
            echo "非台北 23 點，跳過本次觸發"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 已是 23 點：還原 db 分支的 votes.db，檢查今天是否已抓過（同一小時多重觸發去重）
          git fetch --depth=1 origin db 2>/dev/null || true
          if git cat-file -e FETCH_HEAD:votes.db.gz 2>/dev/null; then
            git cat-file blob FETCH_HEAD:votes.db.gz | gunzip > votes.db
            LAST=$(python3 -c "import sqlite3;print((sqlite3.connect('votes.db').execute('SELECT max(ts) FROM snapshot').fetchone()[0] or '')[:10])" 2>/dev/null || echo "")
          else
            LAST=""
          fi
          echo "DB 最新日期=$LAST"
          if [ "$LAST" = "$TODAY" ]; then
            echo "今天已經抓過了，跳過"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Scrape & export
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/scrape.py
          python scripts/export_web.py

      - name: Push votes.db.gz to db branch (single commit, no history)
        if: steps.gate.outputs.run == 'true'
        run: |
          # gzip 壓縮（8萬筆約 1.4MB，遠低於 GitHub 100MB 單檔上限）
          git config user.name github-actions
          git config user.email actions@github.com
          gzip -c -9 votes.db > votes.db.gz
          # commit-tree 造無父節點的 commit，只含 votes.db.gz；force-push 覆蓋 → db 分支永遠 1 個 commit
          BLOB=$(git hash-object -w votes.db.gz)
          TREE=$(printf '100644 blob %s\tvotes.db.gz\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "db snapshot $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')")
          git push -f origin "$COMMIT:refs/heads/db"

      - name: Commit JSON to main
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/data fail_count.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"; exit 0
          fi
          git commit -m "snapshot $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push attempt $i failed; pulling rebase…"
            git pull --rebase --autostash origin main
            sleep $((i*3))
          done
          echo "push failed after 5 retries"
          exit 1
