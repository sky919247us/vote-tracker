name: scrape
on:
  schedule:
    # 每 12 小時跑一次（00:00 / 12:00 UTC = 台北 08:00 / 20:00）
    # 為控制 votes.db 體積，已由每小時改為每 12 小時
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一時間只跑一個 scrape，避免多個 run 同時 push 衝突
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整歷史，rate limit 才看得到 votes.db 真正上次的 commit 時間

      - name: Rate limit (one update per hour boundary)
        id: gate
        run: |
          LAST=$(git log -1 --format=%ct -- votes.db 2>/dev/null || echo 0)
          NOW=$(date +%s)
          LAST_HOUR=$((LAST / 3600))
          NOW_HOUR=$((NOW / 3600))
          echo "上次 hour=$LAST_HOUR  現在 hour=$NOW_HOUR"
          if [ "$LAST" -gt 0 ] && [ "$LAST_HOUR" -ge "$NOW_HOUR" ]; then
            echo "⏭️ 本小時已更新過，跳過"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Scrape & export
        if: steps.gate.outputs.skip != 'true'
        run: |
          python scripts/scrape.py
          python scripts/export_web.py

      - name: Commit & push
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add votes.db docs/data fail_count.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"; exit 0
          fi
          git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 重試 5 次：push 失敗就 rebase 再試（避免並發 push 撞車）
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push attempt $i failed; pulling rebase…"
            git pull --rebase --autostash origin main
            sleep $((i*3))
          done
          echo "push failed after 5 retries"
          exit 1
