name: scrape
on:
  schedule:
    # 每整點跑一次（24 次/天）
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整歷史，rate limit 才看得到 votes.db 真正上次的 commit 時間

      - name: Rate limit (TEMP 1 min for one-off update)
        id: gate
        run: |
          LAST=$(git log -1 --format=%ct -- votes.db 2>/dev/null || echo 0)
          NOW=$(date +%s)
          DIFF=$((NOW - LAST))
          if [ "$LAST" -gt 0 ] && [ "$DIFF" -lt 60 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Scrape & export
        if: steps.gate.outputs.skip != 'true'
        run: |
          python scripts/scrape.py
          python scripts/export_web.py

      - name: Commit & push
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add votes.db docs/data fail_count.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
