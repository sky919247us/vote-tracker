name: scrape
on:
  schedule:
    # 每 12 小時跑一次（00:00 / 12:00 UTC = 台北 08:00 / 20:00）
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一時間只跑一個 scrape，避免多個 run 同時 push 衝突
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # main 只有小檔（程式 + docs/data 的 JSON），淺層 checkout 即可
      - uses: actions/checkout@v4

      - name: Restore votes.db from db branch
        run: |
          # votes.db 不放在 main 歷史，改存於獨立 db 分支（永遠單一 commit、不累積）
          # 因 votes.db 已 >100MB（GitHub 單檔上限），改壓成 votes.db.gz 存放
          git config user.name github-actions
          git config user.email actions@github.com
          if git fetch --depth=1 origin db 2>/dev/null; then
            git cat-file blob FETCH_HEAD:votes.db.gz | gunzip > votes.db
            echo "restored votes.db ($(du -h votes.db | cut -f1))"
          else
            echo "db branch not found yet; starting fresh votes.db"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scrape & export
        run: |
          python scripts/scrape.py
          python scripts/export_web.py

      - name: Push votes.db.gz to db branch (single commit, no history)
        run: |
          # gzip 壓縮（104MB → ~19MB，遠低於 100MB 上限）
          gzip -c -9 votes.db > votes.db.gz
          # 用 commit-tree 造一顆「無父節點」的 commit，只含 votes.db.gz；
          # force-push 覆蓋 db 分支 → 分支永遠只有 1 個 commit，repo 不會肥大
          BLOB=$(git hash-object -w votes.db.gz)
          TREE=$(printf '100644 blob %s\tvotes.db.gz\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "db snapshot $(date -u +'%Y-%m-%d %H:%M UTC')")
          git push -f origin "$COMMIT:refs/heads/db"

      - name: Commit JSON to main
        run: |
          # main 只 commit 網站要讀的小 JSON（docs/data）＋ fail_count.txt
          git add docs/data fail_count.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"; exit 0
          fi
          git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 重試 5 次：push 失敗就 rebase 再試（避免並發 push 撞車）
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push attempt $i failed; pulling rebase…"
            git pull --rebase --autostash origin main
            sleep $((i*3))
          done
          echo "push failed after 5 retries"
          exit 1
